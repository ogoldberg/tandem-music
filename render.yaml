services:
  - type: web
    name: tandem-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: TANDEM_PROVIDER
        value: openai-compatible
      - key: TANDEM_MODEL
        sync: false
      - key: TANDEM_API_KEY
        sync: false
      - key: TANDEM_BASE_URL
        sync: false
      - key: TANDEM_ACCESS_TOKEN
        generateValue: true
      - key: TANDEM_ALLOWED_ORIGINS
        value: https://ogoldberg.github.io
