name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# SEC.9: actions are pinned to commit SHAs (the tag in the comment), and every install but the separation
# job's is from a hashed lock (tools/locks/compile.sh), which pip checks file by file.
jobs:
  audit:
    # SEC.9: fail on a locked package with a known vulnerability (PyPI advisory database and OSV).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/locks/audit.txt
      - run: |
          for lock in requirements.txt requirements-dev.txt requirements-e2e.txt requirements-desktop.txt requirements-models.txt; do
            echo "== $lock"
            python -m pip_audit -r "$lock" --require-hashes --disable-pip --progress-spinner off
          done
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  transcription:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/transcription.test.mjs tests/polish.test.mjs tests/tuning.test.mjs tests/history.test.mjs tests/versions.test.mjs tests/contour.test.mjs tests/groove.test.mjs tests/voices.test.mjs tests/harmony.test.mjs tests/phrases.test.mjs tests/storage.test.mjs tests/recordings.test.mjs tests/samples.test.mjs tests/ideas.test.mjs tests/bundle.test.mjs tests/daw.test.mjs tests/notation.test.mjs tests/dawproject.test.mjs tests/worldtune.test.mjs tests/midi.test.mjs tests/noteedit.test.mjs tests/guide.test.mjs tests/playhead.test.mjs tests/evolution.test.mjs tests/take.test.mjs tests/pitch.test.mjs tests/beats.test.mjs tests/latency.test.mjs tests/mixer.test.mjs tests/layers.test.mjs tests/takes.test.mjs tests/sections.test.mjs tests/tension.test.mjs tests/drawline.test.mjs tests/lyrics.test.mjs tests/genre.test.mjs tests/practice.test.mjs tests/exercises.test.mjs tests/beatbox.test.mjs
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest e2e -q --browser chromium --tracing retain-on-failure --output e2e-results
        env:
          E2E_SERVER_LOG: e2e-server/uvicorn.log
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-traces
          path: e2e-results
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-server-log
          path: e2e-server/uvicorn.log
          if-no-files-found: ignore
  separation:
    # SEP.1: the real HTDemucs model on CPU. TANDEM_REQUIRE_SEPARATION makes a missing package or
    # model fail these tests instead of skipping them. The weights are downloaded by the MODEL.1
    # runtime (pinned URL, SHA-256 and size) and cached by their hash.
    runs-on: ubuntu-24.04
    env:
      TANDEM_TEST_MODEL_HOME: ${{ github.workspace }}/.model-home
      TANDEM_REQUIRE_SEPARATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .model-home/models/htdemucs
          key: htdemucs-d9fa14133cfcc034a6758923bb3a8ca9f8dfd0b582134643bbf83f72c17576dd
      # The CPU build of torch (the PyPI wheel for Linux carries CUDA libraries this job does not use).
      # requirements-models.txt is locked for the Mac app on Apple silicon, so this Linux job installs
      # from the .in sources it is compiled from (no versions or hashes from any lock; torch is pinned on the next line).
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-models.in -r requirements-e2e.in
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_separation.py -q -s
      # GEN.2: the chroma checks need torch and transformers; the real MusicGen-Melody test (6.23 GB) is skipped here.
      - run: python -m pytest tests/test_band.py -q -s
      # TIMBRE.1: the TorchScript stand-in checks need torch; the real RAVE models are skipped here.
      - run: python -m pytest tests/test_timbre.py -q -s
      - run: python -m pytest e2e/test_separation.py -q -s --browser chromium
