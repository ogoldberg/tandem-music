name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  transcription:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/transcription.test.mjs tests/polish.test.mjs tests/tuning.test.mjs tests/history.test.mjs tests/versions.test.mjs tests/contour.test.mjs tests/groove.test.mjs tests/voices.test.mjs
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest e2e -q --browser chromium --tracing retain-on-failure --output e2e-results
        env:
          E2E_SERVER_LOG: e2e-server/uvicorn.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: e2e-results
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: e2e-server/uvicorn.log
          if-no-files-found: ignore
