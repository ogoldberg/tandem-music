name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  transcription:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/transcription.test.mjs tests/polish.test.mjs tests/tuning.test.mjs tests/history.test.mjs tests/versions.test.mjs tests/contour.test.mjs tests/groove.test.mjs tests/voices.test.mjs tests/harmony.test.mjs tests/phrases.test.mjs tests/storage.test.mjs tests/recordings.test.mjs tests/samples.test.mjs tests/ideas.test.mjs tests/bundle.test.mjs tests/daw.test.mjs tests/notation.test.mjs tests/dawproject.test.mjs tests/worldtune.test.mjs tests/midi.test.mjs tests/noteedit.test.mjs tests/guide.test.mjs
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest e2e -q --browser chromium --tracing retain-on-failure --output e2e-results
        env:
          E2E_SERVER_LOG: e2e-server/uvicorn.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: e2e-results
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: e2e-server/uvicorn.log
          if-no-files-found: ignore
  separation:
    # SEP.1: the real HTDemucs model on CPU. TANDEM_REQUIRE_SEPARATION makes a missing package or
    # model fail these tests instead of skipping them. The weights are downloaded by the MODEL.1
    # runtime (pinned URL, SHA-256 and size) and cached by their hash.
    runs-on: ubuntu-24.04
    env:
      TANDEM_TEST_MODEL_HOME: ${{ github.workspace }}/.model-home
      TANDEM_REQUIRE_SEPARATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .model-home/models/htdemucs
          key: htdemucs-d9fa14133cfcc034a6758923bb3a8ca9f8dfd0b582134643bbf83f72c17576dd
      # The CPU build of torch (the PyPI wheel for Linux carries CUDA libraries this job does not use).
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-models.txt -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_separation.py -q -s
      # GEN.2: the chroma checks need torch and transformers; the real MusicGen-Melody test (6.23 GB) is skipped here.
      - run: python -m pytest tests/test_band.py -q -s
      # TIMBRE.1: the TorchScript stand-in checks need torch; the real RAVE models are skipped here.
      - run: python -m pytest tests/test_timbre.py -q -s
      - run: python -m pytest e2e/test_separation.py -q -s --browser chromium
