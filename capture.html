</main>
<script type="module">
// MOB.1 (ADR-013): record a song idea in one tap; every take is kept on this device at once, in the
// same storage as the studio (ideas.js list, recordings.js files), and can be opened in the studio.
import {openKV,persistence,PERSISTENCE_TEXT} from './storage.js';
import {openRecordings} from './recordings.js';
import {createVersionStore} from './versions.js';
import {createIdeaStore,ideaTitle,formatDuration,storageProblem} from './ideas.js';
import {writeBundle,toWav,encodeWav,ideaProject,bundleFileName,BUNDLE_TYPE} from './bundle.js';
import {monoSamples} from './recordings.js';
import {countIn,clickTimes,createTakeCollector,startCapture,takeStart} from './take.js';
import {takeLatency,saveLatency,latencyText,deviceKeyFor,browserEstimate,measureLatency} from './latency.js';
import {GROOVES,grooveById,grooveWindow,cleanBeat,MIN_BPM,MAX_BPM} from './beats.js';
import {createSampleBank,playDrumSample,loadWithin} from './samples.js';
import {synthDrum} from './voices.js';
import {startPitchGuide,guideReading,hzToMidi,drawPitchStrip} from './pitch.js';
import {KEY_NAMES,scalePitchClasses} from './contour.js';
const $=id=>document.getElementById(id);
let kv=null,recordings=null,ideas=null,take=null,starting=false,ticker=null,unsaved=null,downloaded=null,updating=false,player=null,playingId=null,askedToPersist=false;
// Whether the browser promised to keep this site's storage. Asked for once per visit, when an idea is
// first kept (browsers grant it more readily once the site holds something, and some ask the user).
const showPersistence=(request=false)=>persistence(navigator.storage,{request}).then(s=>{$('storageinfo').textContent=PERSISTENCE_TEXT[s]},()=>{});
const status=s=>{$('status').textContent=s};
// FIX.6: an idea still being kept, which Update waits for before it reloads.
const saving=new Set(),held=p=>{saving.add(p);p.then(()=>saving.delete(p),()=>saving.delete(p));return p};
const when=ms=>new Date(ms).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});

function setRecording(on){
  $('record').setAttribute('aria-pressed',String(on));$('record').textContent=on?'Stop':'Record';
  $('record').setAttribute('aria-label',on?'Stop and keep the idea':'Record an idea');
  clearInterval(ticker);ticker=null;
  if(on){const show=()=>{const t=take;if(!t)return;const now=t.rc.currentTime;$('time').textContent=now<t.start?'':formatDuration(now-t.start)};show();ticker=setInterval(show,250)}else $('time').textContent='';
}
// REC.3: a take is captured by take.js's worklet in an AudioContext of its own (a WAV of exactly the frames from the take's
// start to Stop), after an optional one-bar count-in on a click, over an optional starter beat (beats.js) that plays from
// the take's zero until Stop. When something is heard (the count-in or the beat) the take is moved earlier by the round
// trip (latency.js), so the beat kept with the idea lines up with the voice. The choices are kept under tandem-capture-take.
const TAKE_KEY='tandem-capture-take';
let sampleDecoder=null;const samples=createSampleBank({fetchBytes:async u=>{const r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status+' for '+u);return r.arrayBuffer()},decode:b=>(sampleDecoder||=new OfflineAudioContext(1,1,22050)).decodeAudioData(b)});
const drum=(ac,k,t)=>{if(!playDrumSample(ac,samples,k,t))synthDrum(ac,k,t)};
function clickAt(ac,t,accent){if(t<ac.currentTime)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=accent?1600:1000;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.06)}
const latencyStore={getItem:k=>{try{return localStorage.getItem(k)}catch{return null}},setItem:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
function showLatency(l){$('latencyinfo').textContent=latencyText(l);$('latencyinfo').dataset.ms=String(Math.round(l.seconds*1000));$('latencyinfo').dataset.measured=String(l.measured)}
$('beat').replaceChildren(new Option('None',''),...GROOVES.map(g=>new Option(g.name,g.id)));
function takePrefs(){try{const p=JSON.parse(localStorage.getItem(TAKE_KEY)||'{}');return{beat:GROOVES.some(g=>g.id===p.beat)?p.beat:'',bpm:Number(p.bpm)>=MIN_BPM&&Number(p.bpm)<=MAX_BPM?Number(p.bpm):100,countIn:p.countIn===true}}catch{return{beat:'',bpm:100,countIn:false}}}
function saveTakePrefs(){try{localStorage.setItem(TAKE_KEY,JSON.stringify({beat:$('beat').value,bpm:tempo(),countIn:$('countin').checked}))}catch{}}
function tempo(){const v=Math.round(Number($('bpm').value));return v>=MIN_BPM&&v<=MAX_BPM?v:null}
function showBeat(){const id=$('beat').value;$('beatnote').classList.toggle('hide',!id);if(id)samples.load(['drums'])}
{const p=takePrefs();$('beat').value=p.beat;$('bpm').value=p.bpm;$('countin').checked=p.countIn;if(p.beat||p.countIn)$('takeopts').open=true;showBeat()}
$('beat').onchange=()=>{saveTakePrefs();showBeat()};$('countin').onchange=saveTakePrefs;$('bpm').onchange=()=>{if(tempo())saveTakePrefs()};
async function start(){
  if(!ideas||!recordings||take||starting||updating)return;
  const bpm=tempo();if(!bpm){status('Set a speed from '+MIN_BPM+' to '+MAX_BPM+' beats a minute.');return}
  const beat=$('beat').value?cleanBeat({id:$('beat').value,bpm}):null;
  starting=true;stopPlayback();let stream=null,rc=null;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false}})}
  catch(e){starting=false;status('The microphone is not available: '+e.message);return}
  try{
    rc=new AudioContext();await rc.resume();
    if(beat){status('Loading the drums…');await loadWithin(samples,['drums'],3000)}
    const key=await deviceKeyFor(rc,stream,navigator.mediaDevices),lat=takeLatency(latencyStore,key,browserEstimate(rc,stream));showLatency(lat);
    const mic=rc.createMediaStreamSource(stream);let collector=null;const capture=await startCapture(rc,mic,(at,ch)=>collector?.add(at,ch));
    const c=countIn(bpm,rc.currentTime+.1,{on:$('countin').checked}),heard=!!beat||c.beats>0,startAt=takeStart(c.zero,heard?lat.seconds:0);
    collector=createTakeCollector({zero:startAt,rate:rc.sampleRate});
    take={rc,stream,capture,collector,c,start:startAt,latency:heard?lat.seconds:0,beat,next:0,shown:0,counting:null};
    tick(take);take.ticker=setInterval(()=>tick(take),25);setRecording(true);
    $('record').dataset.take=JSON.stringify({zero:c.zero,start:startAt,latency:take.latency,beat,lead:c.lead});
    if($('showpitch').checked)await startGuide(rc,mic);
  }catch(e){if(take?.rc===rc){clearInterval(take.ticker);take=null;setRecording(false)}stream.getTracks().forEach(x=>x.stop());rc?.close().catch(()=>{});status('Could not start recording: '+e.message)}
  finally{starting=false}
}
// Every 25 ms: the count-in's clicks and the beat's hits due in the next 0.2 s, and the status line.
function tick(t){
  if(take!==t)return;const now=t.rc.currentTime,to=now+.2;
  for(const k of clickTimes(t.c,{from:t.next,to,click:false}))clickAt(t.rc,k.t,k.accent);
  if(t.beat)for(const h of grooveWindow(t.beat.id,{bpm:t.beat.bpm,zero:t.c.zero,from:t.next,to}))if(h.t>=now)drum(t.rc,h.k,h.t);
  t.next=to;const counting=now<t.c.zero;
  if(counting){const n=Math.min(t.c.beats,Math.max(1,Math.floor((now-(t.c.zero-t.c.lead))/t.c.beat)+1));if(n!==t.shown){t.shown=n;status('Count-in: '+n+' of '+t.c.beats)}}
  if(counting!==t.counting){t.counting=counting;if(!counting)status(t.beat?'Recording over '+grooveById(t.beat.id).name+' at '+t.beat.bpm+' bpm… tap Stop when the idea is down.':'Recording… tap Stop when the idea is down.')}
}
// SING.1: the live pitch guide (pitch.js). While recording, the microphone's pitch is tracked on the device and drawn as a
// moving line against the nearest note of the chosen key, with how many cents sharp or flat. It only shows: the take is
// recorded as before. The choice is kept in localStorage under tandem-capture-pitch. #pitchnow's data is for tests.
const PITCH_KEY='tandem-capture-pitch';
let guide=null;
function pitchPrefs(){try{const p=JSON.parse(localStorage.getItem(PITCH_KEY)||'{}');return{show:p.show!==false,key:typeof p.key==='string'?p.key:'any'}}catch{return{show:true,key:'any'}}}
function savePitchPrefs(){try{localStorage.setItem(PITCH_KEY,JSON.stringify({show:$('showpitch').checked,key:$('pitchkey').value}))}catch{}}
$('pitchkey').replaceChildren(new Option('Any note','any'),...['major','minor'].flatMap(mode=>KEY_NAMES.map((name,tonic)=>new Option(name+' '+mode,tonic+':'+mode))));
{const p=pitchPrefs();$('showpitch').checked=p.show;$('pitchkey').value=[...$('pitchkey').options].some(o=>o.value===p.key)?p.key:'any'}
$('showpitch').onchange=savePitchPrefs;$('pitchkey').onchange=()=>{savePitchPrefs();if(guide)guide.pcs=keyPcs()};
function keyPcs(){const v=$('pitchkey').value;if(v==='any')return null;const [tonic,mode]=v.split(':');return scalePitchClasses(Number(tonic),mode)}
async function startGuide(ac,source){
  const g={points:[],count:0,from:null,to:null,last:null,frame:0,pcs:keyPcs(),run:null};guide=g;
  try{const t0=ac.currentTime;
    g.run=await startPitchGuide(ac,source,rs=>{if(guide!==g)return;for(const r of rs){const t=r.t-t0;g.points.push({t,m:r.hz?hzToMidi(r.hz):null});g.count++;if(g.points.length>1200)g.points.splice(0,600);if(g.from===null)g.from=t;g.to=t;g.last=r.hz?r.hz:null}if(!g.frame)g.frame=requestAnimationFrame(()=>{g.frame=0;if(guide===g)drawGuide(g)})})}
  catch(e){stopGuide();status('Recording, without the pitch guide: '+e.message);return}
  if(guide!==g){g.run?.stop();return}
  $('pitchnow').textContent='Sing to see your pitch';$('pitchguide').classList.remove('hide');
}
function drawGuide(g){
  const reading=g.last?guideReading(g.last,{pcs:g.pcs}):null,now=$('pitchnow');now.textContent=reading?reading.text:'Sing to see your pitch';
  Object.assign(now.dataset,{count:g.count,from:g.from,to:g.to});
  if(reading)Object.assign(now.dataset,{hz:g.last.toFixed(2),cents:reading.cents,target:reading.target});else for(const k of ['hz','cents','target'])delete now.dataset[k];
  const cv=$('pitchstrip'),w=cv.clientWidth,h=cv.clientHeight,dpr=devicePixelRatio||1;if(!w||!h)return;
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  const cx=cv.getContext('2d');cx.setTransform(dpr,0,0,dpr,0,0);drawPitchStrip(cx,{width:w,height:h,readings:g.points,now:g.to,reading});
}
function stopGuide(){const g=guide;guide=null;if(!g)return;cancelAnimationFrame(g.frame);g.run?.stop();$('pitchguide').classList.add('hide');const now=$('pitchnow');now.textContent='';for(const k of ['hz','cents','target','count','from','to'])delete now.dataset[k]}
async function stop(){
  const t=take;if(!t)return;take=null;clearInterval(t.ticker);const end=t.rc.currentTime;stopGuide();setRecording(false);
  await t.capture.flush();t.stream.getTracks().forEach(x=>x.stop());t.rc.close().catch(()=>{});
  const {channels,frames,rate}=t.collector.finish(end);
  $('record').dataset.take=JSON.stringify({zero:t.c.zero,start:t.start,latency:t.latency,beat:t.beat,lead:t.c.lead,end,rate,frames});
  if(!frames){status(end<t.start?'Stopped during the count-in: nothing was kept.':'Nothing was recorded. Check the microphone and try again.');return}
  const wav=encodeWav(monoSamples({numberOfChannels:channels.length,length:frames,getChannelData:i=>channels[i]}),rate);
  await keep(new Blob([wav],{type:'audio/wav'}),frames/rate,t.beat);
}
async function keep(blob,duration,beat){
  status('Keeping the idea…');
  try{
    await recordings.hold(async()=>ideas.add({duration,audio:await recordings.put(blob),beat}));
    unsaved=null;$('rescue').classList.add('hide');
    status('Kept a '+formatDuration(duration)+' idea on this device'+(beat?', over '+grooveById(beat.id).name+' at '+beat.bpm+' bpm.':'.'));
    if(!askedToPersist){askedToPersist=true;showPersistence(true)}
  }catch(e){
    // Never lose a take silently: offer it as a download instead.
    unsaved=blob;$('rescue').classList.remove('hide');
    status('Could not keep the idea on this device: '+e.message+' Download it so it is not lost.');
  }
  await render();
}
$('record').onclick=()=>{if(take)held(stop()).catch(e=>status('Recording failed: '+e.message));else start()};
// A web app on a phone loses the microphone when it leaves the screen: end the take there and keep it.
document.addEventListener('visibilitychange',()=>{if(document.hidden&&take){held(stop()).then(()=>{if(!unsaved)status($('status').textContent+' Recording stopped when Tandem left the screen.')},e=>status('Recording failed: '+e.message))}});
// REC.3: measure the round trip for this microphone and output: six clicks played and recorded back (latency.js).
let calibrating=false;
$('calibrate').onclick=async()=>{
  if(take||starting||calibrating||updating)return;calibrating=true;$('calibrate').disabled=true;$('record').disabled=true;stopPlayback();let rc=null,stream=null;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});rc=new AudioContext();await rc.resume();
    const key=await deviceKeyFor(rc,stream,navigator.mediaDevices);status('Measuring the delay: six clicks. Keep quiet; with headphones, hold them to the microphone.');
    const r=await measureLatency(rc,rc.createMediaStreamSource(stream));saveLatency(latencyStore,key,r.seconds);showLatency({seconds:r.seconds,measured:true});
    status('Measured the delay: '+Math.round(r.seconds*1000)+' ms ('+r.heard+' of '+r.of+' clicks heard).')}
  catch(e){status('Could not measure the delay: '+e.message)}
  finally{stream?.getTracks().forEach(x=>x.stop());rc?.close().catch(()=>{});calibrating=false;$('calibrate').disabled=false;$('record').disabled=!ideas||!recordings}
};
$('rescue').onclick=()=>{if(!unsaved)return;const ext=/wav/.test(unsaved.type)?'wav':/mp4|aac/.test(unsaved.type)?'m4a':/ogg/.test(unsaved.type)?'ogg':'webm';const u=URL.createObjectURL(unsaved),a=document.createElement('a');a.href=u;a.download='tandem-idea.'+ext;a.click();downloaded=unsaved;setTimeout(()=>URL.revokeObjectURL(u),1000)};

function stopPlayback(){if(player){player.pause();URL.revokeObjectURL(player.src);player=null}const was=playingId;playingId=null;if(was)for(const b of document.querySelectorAll('.idea .play'))b.textContent='Play'}
async function play(idea,button){
  if(playingId===idea.id){stopPlayback();return}
  stopPlayback();
  if(!recordings){status('Recordings cannot be read in this browser.');return}
  try{
    const entry=await ideas.get(idea.id),blob=entry&&await recordings.get(entry.audio);
    if(!blob){status('The recording of this idea is no longer on this device.');return}
    player=new Audio(URL.createObjectURL(blob));playingId=idea.id;button.textContent='Stop';
    player.onended=stopPlayback;await player.play();status('Playing '+ideaTitle(idea,when)+'.');
  }catch(e){stopPlayback();status('Could not play the idea: '+e.message)}
}
// MOB.3: share an idea as one file (bundle.js: the project and its recording as WAV) through the share sheet
// (AirDrop, Files, iCloud Drive) where the browser can share files, or download it elsewhere. Safari refuses a
// share that comes too long after the tap, and building the file takes a moment: then the file is kept ready
// and the next tap shares it at once.
let prepared=null;
const decodeAudio=buffer=>new OfflineAudioContext(1,1,48000).decodeAudioData(buffer);
async function share(idea,button){
  const title=ideaTitle(idea,when);
  if(prepared?.id===idea.id){const file=prepared.file;prepared=null;button.textContent='Share';await send(file,title,button,idea.id,true);return}
  if(prepared){prepared=null;for(const b of document.querySelectorAll('.idea .share'))b.textContent='Share'}
  if(!recordings){status('Recordings cannot be read in this browser.');return}
  status('Preparing '+title+' to share…');
  let file;
  try{
    const entry=await ideas.get(idea.id),blob=entry&&await recordings.get(entry.audio);
    if(!blob){status('The recording of this idea is no longer on this device.');return}
    const bytes=writeBundle({name:idea.name,savedAt:idea.savedAt,project:ideaProject(entry),recordings:{original:await toWav(blob,decodeAudio)}});
    file=new File([bytes],bundleFileName(title),{type:BUNDLE_TYPE});
  }catch(e){status('Could not prepare the idea for sharing: '+e.message);return}
  await send(file,title,button,idea.id,false);
}
async function send(file,title,button,id,retried){
  let why='';
  if(navigator.share&&navigator.canShare?.({files:[file]})){
    try{await navigator.share({files:[file],title});status('Shared '+title+'.');return}
    catch(e){
      if(e.name==='AbortError'){status('Sharing was cancelled.');return}
      if(e.name==='NotAllowedError'&&!retried){prepared={id,file};button.textContent='Tap to share';status('The file is ready. Tap Share again to send it.');return}
      why=' Sharing did not work: '+e.message;
    }
  }
  const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
  status('Downloaded '+file.name+'.'+why);
}
function renameForm(idea,row){
  const form=document.createElement('form');form.className='rename';
  const input=document.createElement('input');input.type='text';input.maxLength=60;input.value=idea.name;input.placeholder='Name this idea';input.setAttribute('aria-label','Idea name');
  const save=document.createElement('button');save.type='submit';save.textContent='Save';
  const cancel=document.createElement('button');cancel.type='button';cancel.textContent='Cancel';cancel.onclick=()=>render();
  form.onsubmit=async e=>{e.preventDefault();try{await ideas.rename(idea.id,input.value);status(input.value.trim()?'Renamed the idea.':'Removed the name.')}catch(err){status('Could not rename the idea: '+err.message)}await render()};
  input.onkeydown=e=>{if(e.key==='Escape')render()};
  form.append(input,save,cancel);row.querySelector('.title').replaceWith(form);input.focus();input.select();
}
// Delete the stored recordings that no idea, version or draft links to.
async function collect(){
  const versions=createVersionStore(kv);
  await recordings.gc(async()=>{const ids=await ideas.audioIds();for(const id of await versions.audioIds())ids.add(id);const draft=await kv.get('draft-audio');for(const l of Object.values(draft||{}))if(l?.id)ids.add(l.id);return ids});
}
function row(idea){
  const li=document.createElement('li');li.className='idea';li.dataset.id=idea.id;
  const title=document.createElement('div');title.className='title';title.textContent=ideaTitle(idea,when);
  const meta=document.createElement('small');meta.textContent=formatDuration(idea.duration)+(idea.name?' · '+when(idea.savedAt):'')+(idea.beat?' · over '+grooveById(idea.beat.id).name+' at '+idea.beat.bpm+' bpm':'');
  const actions=document.createElement('div');actions.className='actions';
  const playB=document.createElement('button');playB.className='play';playB.textContent=playingId===idea.id?'Stop':'Play';playB.onclick=()=>play(idea,playB);
  const renameB=document.createElement('button');renameB.textContent='Rename';renameB.onclick=()=>renameForm(idea,li);
  const shareB=document.createElement('button');shareB.className='share';shareB.textContent=prepared?.id===idea.id?'Tap to share':'Share';shareB.onclick=()=>share(idea,shareB);
  const open=document.createElement('a');open.href='./?idea='+encodeURIComponent(idea.id);open.textContent='Open in studio';
  const del=document.createElement('button');del.textContent='Delete';let armed=null;
  del.onclick=async()=>{
    if(!armed){del.textContent='Tap again to delete';del.classList.add('danger');armed=setTimeout(()=>{armed=null;del.textContent='Delete';del.classList.remove('danger')},4000);return}
    clearTimeout(armed);if(playingId===idea.id)stopPlayback();
    try{await ideas.remove(idea.id);status('Deleted '+ideaTitle(idea,when)+'.');await render();await collect()}catch(e){status('Could not delete the idea: '+e.message)}
  };
  actions.append(playB,shareB,renameB,open,del);li.append(title,meta,actions);return li;
}
async function render(){
  const root=$('ideas');let list;
  try{list=await ideas.list()}catch(e){root.replaceChildren();$('count').textContent='';status(e.message);return}
  $('count').textContent=list.length?'('+list.length+')':'';
  if(!list.length){const p=document.createElement('li');p.className='muted';p.textContent='No ideas yet. Tap Record and sing.';root.replaceChildren(p);return}
  root.replaceChildren(...list.map(row));
}

$('record').disabled=true;
try{
  kv=await openKV(window.indexedDB);ideas=createIdeaStore(kv);
  recordings=await openRecordings(navigator.storage,{locks:navigator.locks||null});
  $('record').disabled=false;status(navigator.mediaDevices?.getUserMedia?'Ready. Tap Record and sing.':'This browser cannot record from the microphone.');
  if(!navigator.mediaDevices?.getUserMedia)$('record').disabled=true;
  await render();
}catch(e){status(storageProblem(e));if(ideas)await render().catch(()=>{})}
showPersistence();
// FIX.6: a new version waits, installed whole by the service worker, until Update activates it and reloads.
// Update reloads the page: never while a take is being recorded or kept, or while a take the device would not keep
// is only in this page (its download not yet offered to the person).
function blocked(){if(take||starting||calibrating){status('Stop the recording first: Update reloads Tandem.');return true}if(unsaved&&downloaded!==unsaved){status('Download the recording that was not kept first: Update reloads Tandem, and it is not saved on this device.');return true}return false}
if('serviceWorker'in navigator){const sw=navigator.serviceWorker;let taking=false,stale=false;const offer=reg=>{$('swupdate').hidden=!(stale||reg.waiting&&sw.controller)};sw.addEventListener('controllerchange',()=>{if(taking)location.reload();else{stale=true;$('swupdate').hidden=false}});sw.register('./sw.js').then(reg=>{offer(reg);reg.addEventListener('updatefound',()=>reg.installing?.addEventListener('statechange',()=>offer(reg)));$('swupdate').onclick=async()=>{if(taking)return;if(blocked())return;const could=$('record').disabled;taking=updating=true;$('swupdate').disabled=$('record').disabled=true;while(saving.size)await Promise.allSettled([...saving]);if(blocked()){taking=updating=false;$('swupdate').disabled=false;$('record').disabled=could;return}if(reg.waiting)reg.waiting.postMessage('activate');else location.reload()}}).catch(()=>{})}
